[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "polyglot-learn"
version = "0.1.0"
description = "Learn several programming languages side by side, organized around concepts, with the why."
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = ["PyYAML>=6", "Markdown>=3.4"]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
polyglot = "polyglot.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

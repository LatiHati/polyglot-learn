name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: pip install -e ".[dev]"
      - run: pytest
      - run: polyglot validate
      - run: polyglot stale --strict
      # Every example runs in its own language container; a skipped example fails the build.
      - run: polyglot verify --mode docker --strict
      - run: polyglot build --out site
